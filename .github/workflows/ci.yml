# Build viproc with pip (scikit-build-core, Release) and run the Python tests,
# on Linux (GCC) and Windows (MSVC) - the same steps as dev.sh / dev.cmd.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: python -m pip install -v ".[test]"
      - name: pytest
        run: python -m pytest -q python/tests
