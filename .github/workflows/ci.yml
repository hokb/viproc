# Build viproc with pip (scikit-build-core, Release) and run the Python tests,
# on Linux (GCC) and Windows (MSVC) - the same steps as dev.sh / dev.cmd.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # O4's OpenCL tests (python/tests/test_opencl.py) on pocl's CPU device
      # with CLBlast; the headers spare CMake the download.
      - name: OpenCL (pocl, CLBlast)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd libclblast1 opencl-headers ocl-icd-libopencl1 libvkfft-dev
      - name: pocl kernel cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pocl
          key: pocl-${{ runner.os }}-${{ hashFiles('src/device/opencl/*') }}
          restore-keys: pocl-${{ runner.os }}-
      - name: Build and install
        run: python -m pip install -v ".[test]"
      - name: pytest
        env:
          VIPROC_TEST_OPENCL_DEVICE: any
        run: python -m pytest -q python/tests

  # dev.cmd's script, started as from Visual Studio's default (x86) developer
  # prompt: it must still build for the 64-bit interpreter.
  dev-windows:
    runs-on: windows-latest
    env:
      VSCMD_ARG_TGT_ARCH: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: tools/dev.ps1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\dev.ps1 -NoPull -Python python
